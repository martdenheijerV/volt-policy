# Volt Policy Management — full self-hosted stack on Hetzner.
#
# Single compose, no external networks: this stack ships its own
# Postgres 17 container (see `db` below) so there's no dependency on
# any third-party platform's compose. Backups live on the host via
# the `pg_data` volume; nightly dumps go to Hetzner Storage Box via
# the `backup` service (see DEPLOY.md for details).
#
# Reverse proxy: Caddy auto-issues Let's Encrypt certs for the listed
# subdomains. Point your DNS A-records at the VPS IP first.

version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - volt

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-volt_policy}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Migrations directory is mounted read-only; apply with
      #   docker compose exec db psql -U $POSTGRES_USER -d $POSTGRES_DB -f /migrations/<file>.sql
      - ../db/migrations:/migrations:ro
    expose:
      - "5432"
    networks:
      - volt

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: volt-policy:latest
    restart: unless-stopped
    env_file: ../.env.production
    expose:
      - "3000"
    depends_on:
      - db
      - languagetool
      - hocuspocus
    networks:
      - volt

  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    expose:
      - "8010"
    networks:
      - volt

  hocuspocus:
    build:
      context: ./hocuspocus
      dockerfile: Dockerfile
    image: volt-hocuspocus:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOCUS_SECRET: ${HOCUS_SECRET}
    expose:
      - "1234"
    depends_on:
      - db
    networks:
      - volt

volumes:
  caddy_data:
  caddy_config:
  pg_data:

networks:
  volt:
