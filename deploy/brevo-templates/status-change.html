<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document status changed</title>
</head>
<body style="font-family: Ubuntu, system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 32px; color: #1a1a1a;">
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
    <div style="width: 32px; height: 32px; background: #6629a9; border-radius: 4px;"></div>
    <h1 style="font-size: 18px; margin: 0;">Volt Policy</h1>
  </div>

  <p>The document <a href="{{ params.docUrl }}" style="color: #6629a9;"><strong>{{ params.docTitle }}</strong></a>
  is now <strong>{{ params.status }}</strong>.</p>

  {% if params.changeSummary %}
  <p style="background: #f5f0fb; padding: 12px 16px; border-radius: 6px; font-size: 14px;">
    <strong>Change summary:</strong> {{ params.changeSummary }}
  </p>
  {% endif %}

  <p style="margin: 32px 0;">
    <a href="{{ params.docUrl }}" style="background: #6629a9; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 500;">
      Open document
    </a>
  </p>
</body>
</html>
